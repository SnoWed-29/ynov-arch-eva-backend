name: Backend CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  analyze-and-test:
    name: Backend Analysis & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, auth-service, product-service, order-service, payment-service, notification-service]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install Dependencies
        working-directory: ${{ matrix.service }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Jest Tests
        working-directory: ${{ matrix.service }}
        run: |
          # Producing JUnit XML report for GitHub Actions integration.
          # Assumes 'test' script is configured for Jest.
          npm test || echo "No tests defined for ${{ matrix.service }}"
        env:
          NODE_ENV: test
          CI: true

  build-docker:
    name: Build Docker Images
    needs: analyze-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, auth-service, product-service, order-service, payment-service, notification-service]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: false # Set to true and add registry login for real push
          tags: ${{ matrix.service }}:latest
