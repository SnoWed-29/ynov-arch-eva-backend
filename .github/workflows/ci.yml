name: Backend CI Pipeline

on:
  push:
    branches:
      - main
      - master

env:
  # Opt-in to Node.js 24 for actions to avoid deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze-and-test:
    name: Backend Analysis & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Don't cancel other services if one fails
      matrix:
        service: [api-gateway, auth-service, product-service, order-service, payment-service, notification-service]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          # Use package.json for caching since package-lock.json is missing
          cache-dependency-path: ${{ matrix.service }}/package.json

      - name: Install Dependencies
        working-directory: ${{ matrix.service }}
        run: |
          # Using npm install because package-lock.json is missing
          npm install

      - name: Run Tests
        working-directory: ${{ matrix.service }}
        run: |
          # Run the health check tests we created
          npm test
        env:
          NODE_ENV: test
          CI: true

  build-docker:
    name: Build Docker Images
    needs: analyze-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, auth-service, product-service, order-service, payment-service, notification-service]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: ${{ matrix.service }}:latest
          # Enable caching for docker builds to speed up subsequent runs
          cache-from: type=gha
          cache-to: type=gha,mode=max
