version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres        # individual DBs are created by each service via Sequelize
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - microservices-net

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: always
    ports:
      - '3000:3000'
    env_file: ./api-gateway/.env
    depends_on:
      - auth-service
    networks:
      - microservices-net

  auth-service:
    build: ./auth-service
    container_name: auth-service
    restart: always
    ports:
      - '3001:3001'
    env_file: ./auth-service/.env
    depends_on:
      - postgres
    networks:
      - microservices-net

  product-service:
    build: ./product-service
    container_name: product-service
    restart: always
    ports:
      - '3002:3002'
    env_file: ./product-service/.env
    depends_on:
      - postgres
    networks:
      - microservices-net

  order-service:
    build: ./order-service
    container_name: order-service
    restart: always
    ports:
      - '3003:3003'
    env_file: ./order-service/.env
    depends_on:
      - postgres
      - product-service
      - notification-service
    networks:
      - microservices-net

  payment-service:
    build: ./payment-service
    container_name: payment-service
    restart: always
    ports:
      - '3004:3004'
    env_file: ./payment-service/.env
    depends_on:
      - postgres
      - order-service
      - notification-service
    networks:
      - microservices-net

  notification-service:
    build: ./notification-service
    container_name: notification-service
    restart: always
    ports:
      - '3005:3005'
    env_file: ./notification-service/.env
    networks:
      - microservices-net

volumes:
  pgdata:

networks:
  microservices-net:
    driver: bridge